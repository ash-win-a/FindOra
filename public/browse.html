<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Listings – FINDORA</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/images/logo.svg" alt="Findora Logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house me-1"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/browse.html"><i class="fa-solid fa-compass me-1"></i> Browse Listings</a></li>
          <li class="nav-item"><a class="nav-link" href="/report-lost.html"><i class="fa-solid fa-circle-question me-1 text-danger"></i> Report Lost</a></li>
          <li class="nav-item"><a class="nav-link" href="/report-found.html"><i class="fa-solid fa-hand-holding-heart me-1 text-teal"></i> Report Found</a></li>
        </ul>

        <ul class="navbar-nav align-items-lg-center" id="navbar-auth-links"></ul>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="py-4 bg-white border-bottom shadow-sm">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="fw-bold text-navy mb-1"><i class="fa-solid fa-compass text-teal me-2"></i> Browse Lost &amp; Found Items</h2>
          <p class="text-muted small mb-0">Search through active campus reports, filter by category or location, and locate belongings.</p>
        </div>
        <div class="d-flex gap-2">
          <a href="/report-lost.html" class="btn btn-outline-danger btn-sm">
            <i class="fa-solid fa-plus-circle me-1"></i> Report Lost
          </a>
          <a href="/report-found.html" class="btn btn-teal btn-sm">
            <i class="fa-solid fa-plus-circle me-1"></i> Report Found
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container py-4 flex-grow-1">
    
    <!-- Filter Bar Card -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
      <div class="row g-3 align-items-center">
        <!-- Search Keyword -->
        <div class="col-lg-4 col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search by title, brand, keyword...">
          </div>
        </div>

        <!-- Type Filter -->
        <div class="col-lg-2 col-md-3 col-6">
          <select id="type-filter" class="form-select">
            <option value="">All Types (Lost &amp; Found)</option>
            <option value="found">Found Items Only</option>
            <option value="lost">Lost Items Only</option>
          </select>
        </div>

        <!-- Category Filter -->
        <div class="col-lg-2 col-md-3 col-6">
          <select id="category-filter" class="form-select">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Bags">Bags</option>
            <option value="Wallets and Cards">Wallets &amp; Cards</option>
            <option value="Documents">Documents</option>
            <option value="Keys">Keys</option>
            <option value="Accessories">Accessories</option>
            <option value="Books">Books</option>
            <option value="Clothing">Clothing</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Location Filter -->
        <div class="col-lg-2 col-md-6 col-6">
          <input type="text" id="location-filter" class="form-control" placeholder="Filter by location...">
        </div>

        <!-- Sort Filter -->
        <div class="col-lg-2 col-md-6 col-6">
          <select id="sort-filter" class="form-select">
            <option value="newest">Sort: Newest First</option>
            <option value="oldest">Sort: Oldest First</option>
            <option value="az">Sort: Title (A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Filter status row -->
      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
        <span class="small text-muted fw-semibold" id="results-count">Loading items...</span>
        <button id="clear-filters-btn" class="btn btn-link btn-sm text-decoration-none text-danger p-0">
          <i class="fa-solid fa-rotate-left me-1"></i> Clear All Filters
        </button>
      </div>
    </div>

    <!-- Items Grid Container -->
    <div class="row" id="items-container">
      <!-- Dynamic Item Cards injected by /js/browse.js -->
    </div>

    <!-- Pagination -->
    <div class="mt-4" id="pagination-container"></div>
  </main>

  <!-- Footer -->
  <footer class="py-4 bg-navy text-slate">
    <div class="container text-center small">
      &copy; 2026 FINDORA. Smart Lost and Found Management System.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/browse.js"></script>
</body>
</html>
